name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths: ['frontend/**']

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Las pruebas del frontend no tienen dependencias: no hace falta npm install
      - run: npm test
