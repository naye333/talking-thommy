# Despliegue del backend en Render (Blueprint).
# En Render: New → Blueprint → elegir este repositorio. Pedirá DATABASE_URL, GROQ_API_KEY y
# ORIGENES_PERMITIDOS; JWT_SECRETO se genera solo. Al arrancar, el servidor aplica las migraciones.
services:
  - type: web
    name: talking-thommy-backend
    runtime: node
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ENTORNO
        value: produccion
      - key: JWT_SECRETO
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ORIGENES_PERMITIDOS
        sync: false
