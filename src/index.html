<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Talking Thommy</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <h1>English AI Tutor</h1>

            <p class="subtitle">
                Aprende ingles con Thommy
            </p>


        
            <form id="loginForm">


                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    required
                >

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Tu contraseña"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>


            </form>

            <p id="message"></p>

            <p class="register">
                ¿No tienes cuenta?
                <a href="#">Crear cuenta</a>
            </p>

        </div>

    </div>

    
    <script src="script.js"></script>

</body>
</html>
